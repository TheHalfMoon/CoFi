name: P00 authorized donor source import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p00-source-import.yml

permissions:
  contents: write

concurrency:
  group: p00-authorized-donor-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: p00/authorized-donor-import
      METEROID_SHA: c72f3f05715a122c70e14b51e42fecd111b57e87
      LAGO_SHA: a0de065beab237f357f033c6aa92058ebd417d5c
      OPENMETER_SHA: cebcd9f8b9f6a1b5cf473d3bb7065450549b4240
      HYPERSWITCH_SHA: d03f8547d6367fab56690e4f5043590be4935dcd

    steps:
      - name: Checkout CoFi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure import branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${TARGET_BRANCH}:${TARGET_BRANCH}"
            git checkout "${TARGET_BRANCH}"
            git merge --no-edit origin/main
          else
            git checkout -b "${TARGET_BRANCH}" origin/main
            git push -u origin "${TARGET_BRANCH}"
          fi

      - name: Import pinned donor snapshots
        shell: bash
        run: |
          set -euo pipefail

          import_donor() {
            local name="$1"
            local repo="$2"
            local sha="$3"
            local target="upstream/${name}/${sha}"
            local clone_dir="${RUNNER_TEMP}/${name}"

            if [ -d "${target}" ]; then
              echo "${target} already exists; preserving immutable snapshot."
              return 0
            fi

            rm -rf "${clone_dir}"
            git clone --filter=blob:none --no-checkout "https://github.com/${repo}.git" "${clone_dir}"
            git -C "${clone_dir}" fetch --depth 1 origin "${sha}"

            mkdir -p "${target}"
            git -C "${clone_dir}" archive --format=tar "${sha}" | tar -xf - -C "${target}"

            large_files="$(find "${target}" -type f -size +99M -print || true)"
            if [ -n "${large_files}" ]; then
              echo "Import blocked: tracked files exceed the GitHub 100 MiB file limit:" >&2
              printf '%s\n' "${large_files}" >&2
              exit 42
            fi

            printf '%s\n' "${repo}@${sha}" > "upstream/${name}/SOURCE"

            git add "upstream/${name}"
            git commit -m "vendor(${name}): import ${repo}@${sha}"
            git push origin "HEAD:${TARGET_BRANCH}"
          }

          import_donor "meteroid" "meteroid-oss/meteroid" "${METEROID_SHA}"
          import_donor "lago" "getlago/lago" "${LAGO_SHA}"
          import_donor "openmeter" "openmeterio/openmeter" "${OPENMETER_SHA}"
          import_donor "hyperswitch" "juspay/hyperswitch" "${HYPERSWITCH_SHA}"

      - name: Write machine-readable import manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > upstream/import-manifest.json <<EOF
          {
            "schema_version": 1,
            "project": "Community Finance",
            "brand": "CoFi",
            "donors": [
              {"name":"meteroid","repository":"meteroid-oss/meteroid","commit":"${METEROID_SHA}","path":"upstream/meteroid/${METEROID_SHA}"},
              {"name":"lago","repository":"getlago/lago","commit":"${LAGO_SHA}","path":"upstream/lago/${LAGO_SHA}"},
              {"name":"openmeter","repository":"openmeterio/openmeter","commit":"${OPENMETER_SHA}","path":"upstream/openmeter/${OPENMETER_SHA}"},
              {"name":"hyperswitch","repository":"juspay/hyperswitch","commit":"${HYPERSWITCH_SHA}","path":"upstream/hyperswitch/${HYPERSWITCH_SHA}"}
            ]
          }
          EOF
          git add upstream/import-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record P00 donor import manifest"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Verify pinned snapshots
        shell: bash
        run: |
          set -euo pipefail
          test -f "upstream/meteroid/${METEROID_SHA}/Cargo.toml" || test -f "upstream/meteroid/${METEROID_SHA}/README.md"
          test -f "upstream/lago/${LAGO_SHA}/README.md"
          test -f "upstream/openmeter/${OPENMETER_SHA}/README.md"
          test -f "upstream/hyperswitch/${HYPERSWITCH_SHA}/README.md"
          git status --short
