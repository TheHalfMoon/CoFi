[workspace]
members = ["crates/cofi-ledger", "crates/cofi-community", "crates/cofi-governance", "crates/cofi-spending", "crates/cofi-disbursements", "crates/cofi-provider-contract", "crates/cofi-reconciliation", "crates/cofi-metering", "crates/cofi-billing", "crates/cofi-payments"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/CoFi"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
